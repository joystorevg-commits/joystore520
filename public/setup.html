<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Joy Store | Primeiro acesso</title></head><body><main class="auth-wrap"><form id="setup" class="card auth-card"><div class="brand-name">JOY STORE</div><h1>Primeiro acesso</h1><p class="muted">Crie a conta da proprietária. Esta configuração funciona uma única vez.</p><div class="field"><label for="token">Código de configuração</label><input id="token" type="password" required autocomplete="off"></div><div class="field"><label for="name">Nome</label><input id="name" required autocomplete="name"></div><div class="field"><label for="email">E-mail</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label for="password">Senha (mínimo 12 caracteres)</label><input id="password" type="password" minlength="12" required autocomplete="new-password"></div><p id="message" role="alert"></p><button class="btn rose">Criar minha conta</button><p><a href="painel.html">Ir para o login</a></p></form></main><script src="setup.js"></script></body></html>
