.link[aria-disabled="true"]{opacity:.65;cursor:wait;pointer-events:none} </style></head><body><main><img class="mark" src="../assets/icon512.png" alt="Joy Store" width="108" height="108"><div class="eyebrow">Moda feminina · Canal oficial</div><h1>Seu estilo,<br><em>sua essência.</em></h1><p>Encontre peças que valorizam seu jeito de ser e inspire-se com a Joy Store.</p><nav aria-label="Links oficiais"><a class="link primary" href="../?utm_source=instagram&amp;utm_medium=bio&amp;utm_campaign=link_bio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16l1 14H3L4 7Z"/><path d="M8 9V6a4 4 0 0 1 8 0v3"/></svg><span><strong>Ver coleção</strong><small>Explore nossa loja online</small></span><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m9 5 7 7-7 7"/></svg></a><a class="link" id="whatsapp" aria-disabled="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.7a8.5 8.5 0 0 1-12.6 7.5L3 20.5l1.3-4.8A8.5 8.5 0 1 1 20.5 11.7Z"/><path d="M8 8c0 4 4 8 7.5 8l1.5-2-2.8-1.6-1.1 1c-1.5-.6-2.7-1.8-3.3-3.3l1-1.1L9.3 6.5 8 8Z"/></svg><span><strong>Comprar pelo WhatsApp</strong><small>Carregando atendimento…</small></span><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m9 5 7 7-7 7"/></svg></a></nav><p id="status" role="status" style="margin:14px auto 0;font-size:12px" hidden></p><footer><div class="line"></div>Joy Store · Moda feminina</footer></main><script src="../catalog-config.js"></script><script>
(function(){
  const button=document.getElementById('whatsapp');
  const subtitle=button.querySelector('small');
  const status=document.getElementById('status');
  const message='Olá! Vim através do link da bio do Instagram da Joy Store e gostaria de saber mais sobre os produtos. 💕';
  const api=(window.JOY_API_ORIGIN || location.origin).replace(/\/$/,'');
  fetch(api+'/api/catalog',{credentials:'omit',cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('API');return r.json();}).then(data=>{
    const phone=String(data.settings?.whatsapp||'').replace(/\D/g,'');
    if(!/^55[1-9][0-9]{9,10}$/.test(phone))throw new Error('WhatsApp');
    button.href='https://wa.me/'+phone+'?text='+encodeURIComponent(message);
    button.removeAttribute('aria-disabled');
    subtitle.textContent='Fale diretamente com a loja';
  }).catch(()=>{
    subtitle.textContent='Atendimento indisponível no momento';
    status.hidden=false;status.textContent='Atualize a página para tentar novamente ou consulte o catálogo.';
  });
})();
</script></body></html>
